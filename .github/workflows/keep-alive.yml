name: Keep Supabase Alive

on:
  schedule:
    # Roda às 09:00 UTC (06:00 horário de Brasília) toda segunda, quarta e sexta
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch: # permite rodar manualmente pela aba Actions também

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (SELECT leve em stores)
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/stores?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP status: $response"
          cat /tmp/response.json

          if [ "$response" -ne 200 ]; then
            echo "❌ Ping falhou com status $response"
            exit 1
          fi

          echo "✅ Ping no Supabase realizado com sucesso"
